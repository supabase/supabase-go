name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
      # No `go mod tidy` gate yet: with zero external dependencies the go.mod
      # files only carry the sibling `require` lines (set via `go mod edit`), and
      # `go mod tidy` does not use the workspace, so it would try to resolve the
      # unpublished siblings from the module proxy and fail.
      - run: ./scripts/build-and-test.sh
      - run: ./scripts/telemetry-test.sh

  # Integration tests run against a local Supabase stack.
  # This job's matrix mirrors build-and-test.
  # GitHub's ubuntu-latest image ships Docker as part of the trusted image baseline.
  integration-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
      # Restores the pinned Supabase CLI binaries that the script below
      # otherwise fetches from its GitHub release. The pinned version and its
      # checksums live in that script, so hashing it keys the cache: any bump
      # re-keys automatically. A missing or stale restore is safe - the script
      # verifies the installed version and re-fetches on mismatch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/supabase
            ~/go/bin/supabase-go
          key: supabase-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/integration-test.sh') }}
      - run: ./scripts/integration-test.sh

  # Lint calls a single script that is also what developers run locally
  # (identical command in both places). Tool versions are checksum-pinned in
  # tools/go/go.mod + tools/go/go.sum. The vulnerability scan runs from its
  # own workflow, vulnerability-scan.yml, on a superset of these triggers.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - run: ./scripts/lint.sh

  # cSpell runs on Node, which the ubuntu-latest image already provides, so this
  # job needs no setup-go and no setup-node - the runner's Node is part of the
  # trusted image baseline, the same category as the OS and `ubuntu-latest`
  # itself.
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: npm ci --prefix tools/node
      - run: ./scripts/spell-check.sh

  repository-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # check-module-paths.sh calls `go work edit` / `go mod edit`, so this job
      # needs the toolchain (jq is part of the ubuntu-latest image). Structural
      # checks are our own environment, so it tracks stable like lint and vuln.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable

      # CONTRIBUTING and SECURITY are delegated to the org-level supabase/.github
      # repository; a repo-local copy would silently override the org default, so
      # we assert their absence rather than ignore them. The check covers the
      # locations GitHub recognises (repo root, .github/, docs/).
      - name: Assert org-delegated files are absent
        run: |
          offenders=$(git ls-files \
            | grep -iE '^((\.github|docs)/)?(CONTRIBUTING|SECURITY)(\.[a-z]+)?$' || true)
          if [ -n "$offenders" ]; then
            echo "These files are provided org-wide by supabase/.github and must not exist in this repository:"
            echo "$offenders"
            echo "Put repo-specific guidance in DEVELOPMENT.md instead."
            exit 1
          fi

      # Every first-party require in a published (workspace) module must name
      # another published module, or a consumer could not resolve it. The
      # go.work overlay otherwise hides such a path until tags exist. The same
      # script holds the require graph to its layering DAG: core requires
      # nothing first-party, domains require only core and only the root
      # composes the domains. This is the same script developers run locally
      # via check-fast.sh.
      - name: Assert published module requires resolve and respect the DAG
        run: ./scripts/check-module-paths.sh
