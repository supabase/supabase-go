# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json

# The version of the configuration file format.
version: "0.2"

readonly: true
language: en-US
caseSensitive: true
enableGlobDot: true

ignorePaths:
  - node_modules/

dictionaryDefinitions:
  - name: local-codebase
    path: dictionary.txt

dictionaries: [local-codebase]

# The en_US dictionary is built from the SCOWL size-70 "large" word list, which
# accepts common British variants (favour, behaviours), so American-variant
# consistency is enforced here rather than by the locale.
flagWords:
  - behaviour->behavior
  - behaviours->behaviors
  - decentralised->decentralized
  - favour->favor
  - focussing->focusing
  - optimisations->optimizations
  - stabilisation->stabilization
  - synchronisation->synchronization

patterns:

  # GitHub is a proper noun, written "GitHub" in prose (which caseSensitive
  # enforces). Its host in a URL or Go module path is correctly lowercase, so
  # this pattern captures the "github.com" host wherever it appears.
  - name: github-url-host
    pattern: /github\.com/g

  # Supabase is a proper noun ("Supabase" in prose), but the name is legitimately
  # lowercase in code-shaped contexts: qualified identifiers (supabase.New,
  # supabase.Option), org and repository paths (supabase/.github), project domains
  # (supabase.co), any hyphenated SDK name (this module's supabase-go and sibling
  # SDKs like supabase-js, supabase-swift, supabase-py), the Go import alias
  # (supabase "github.com/...) and doc-comment prose naming the root package ("the
  # root supabase package", "the root supabase client"). The hyphen branch matches
  # -<lowercase> generally so a new sibling SDK needs no config change. A bare
  # mis-cased "supabase" in prose matches no branch and is still flagged.
  - name: supabase-prefix
    pattern: /supabase(\.\w+|\/[\w.-]+|-[a-z]+\b| package\b| client\b| "github\.com)/g
  # The same name preceded by a qualifier rather than followed by one: a
  # "package"/"Package" declaration keyword, a path segment ("/supabase"), or a
  # backtick opening an inline-code command or identifier (`supabase status ...`),
  # where lowercase is always correct. The backtick is a general signal, so CLI
  # subcommands need not be enumerated.
  - name: supabase-suffix
    pattern: /(Package |package |\/|`)supabase/g

  # Local variable named "supabase" (aligned with docs for the JS, Swift,
  # Flutter and Python SDKs). In Go source, a bare "supabase" is unambiguously
  # the package name or a local variable of that name, never prose, however
  # it's used (declaration, dot access, comparison, function argument, ...),
  # so it's ignored wholesale via the *.go override below rather than by
  # enumerating every syntactic shape it can appear in.
  # This will also loop in accidental lowercase brand references in
  # in doc-comments, but that's a compromise we're accepting.
  - name: supabase-identifier
    pattern: /\bsupabase\b/g

ignoreRegExpList:
  - github-url-host
  - supabase-prefix
  - supabase-suffix

# Settings scoped to specific file globs, merged with (not replacing) the
# top-level settings above for files that match.
overrides:
  # supabase-identifier is confined to Go source: it ignores "supabase" as a
  # bare word wherever it appears, which would be too broad to apply to
  # Markdown prose, where a lowercase "supabase" is a genuine miscapitalization
  # of the "Supabase" proper noun that cspell should keep flagging.
  - filename: "**/*.go"
    ignoreRegExpList:
      - supabase-identifier
