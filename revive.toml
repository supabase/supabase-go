# A configuration file enables only the rules it names, so revive's default
# set is enabled explicitly.
enable-default-rules = true

[rule.bare-return]

[rule.call-to-gc]

[rule.confusing-naming]

[rule.confusing-results]

[rule.constant-logical-expr]

[rule.datarace]

[rule.deep-exit]

[rule.defer]

[rule.early-return]

[rule.empty-lines]

# Sized make calls are exempt.
[rule.enforce-map-style]
arguments = ["literal"]

# Adjacent parameters and named results of one type share it: a, b string.
[rule.enforce-repeated-arg-type-style]
arguments = ["short"]

# Sized make calls and nil slices are exempt.
[rule.enforce-slice-style]
arguments = ["literal"]

# The exported rule's default skips the methods of exported interfaces.
[rule.exported]
arguments = ["check-public-interface"]

[rule.filename-format]

[rule.flag-parameter]

[rule.forbidden-call-in-wg-go]

[rule.get-return]

[rule.identical-branches]

[rule.identical-ifelseif-branches]

[rule.identical-switch-branches]

[rule.identical-switch-conditions]

[rule.if-return]

[rule.import-alias-naming]

[rule.import-shadowing]

[rule.marshal-receiver]

[rule.multiline-if-init]

[rule.package-directory-mismatch]

[rule.package-naming]

[rule.redundant-build-tag]

[rule.redundant-import-alias]

[rule.redundant-test-main-exit]

[rule.time-date]

[rule.unchecked-type-assertion]

[rule.unexported-naming]

[rule.unnecessary-format]

[rule.unnecessary-stmt]

[rule.unused-receiver]

[rule.use-fmt-print]

[rule.use-slices-concat]

[rule.use-slices-sort]

[rule.use-waitgroup-go]

[rule.useless-break]

[rule.useless-fallthrough]

# The SDK's own initialisms, which revive's built-in list lacks.
[rule.var-naming]
arguments = [[], ["JWK", "JWKS", "JWT", "MFA", "OIDC", "OTP", "PKCE", "RLS", "SDK", "TOTP"]]

# Rules not enabled, grouped by reason.
#
# Already checked by another tool that scripts/lint.sh runs:
# - atomic: go vet's atomic analyzer
# - comment-spacings: gofumpt
# - duplicated-imports: staticcheck's ST1019
# - identical-ifelseif-conditions: staticcheck's SA4014
# - string-of-int: go vet's stringintconv analyzer
# - struct-tag: staticcheck's SA5008
# - unconditional-recursion: staticcheck's SA5007
# - unhandled-error: errcheck
# - waitgroup-by-value: go vet's copylocks analyzer
#
# Would report nothing in this repository:
# - epoch-naming, inefficient-map-lookup, time-equal: they need type information, which revive cannot load for a package that imports another module (https://github.com/revive-lint/revive/issues/1277)
# - optimize-operands-order: it reports at confidence 0.3, below revive's default threshold of 0.8
# - range-val-address, range-val-in-closure: revive switches them off at Go 1.22 and later
# - use-errors-new: revive switches it off at Go 1.26 and later
#
# Flag idioms this codebase uses on purpose:
# - modifies-parameter: reassigning a parameter, as when defaulting a nil one
# - nested-structs: an anonymous struct as a field's type, which decodes a nested JSON object in place
#
# Enforce a limit or a list of the project's own choosing, and this codebase sets none:
# - add-constant, argument-limit, banned-characters, cognitive-complexity, comments-density, cyclomatic, file-header, file-length-limit, function-length, function-result-limit, imports-blocklist, line-length-limit, max-control-nesting, max-public-structs, string-format
