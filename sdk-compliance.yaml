  client.observability.diagnostic_logging:
    status: implemented
    note: |
      One logger for the whole SDK, injected at construction and flowing to
      every domain client through the shared transport, which writes one
      debug log emission per request round trip. Silent by default via a
      discard logger, and credentials, bodies, query strings and header
      values are never logged.
    symbols:
      - core/configuration.WithLogger
  client.observability.trace_propagation:
    status: implemented
    note: |
      Vendor-neutral by construction rather than through SDK-owned trace
      machinery: every call's context.Context reaches its outgoing request,
      and WithHTTPClient injects a caller-instrumented transport (for example
      otelhttp.NewTransport) that reads the active span from the request
      context and writes the W3C trace context headers. No OpenTelemetry type
      or dependency enters the SDK surface, and no host allow-list is needed
      because the injected transport serves only this SDK's requests to the
      project URL.
    symbols:
      - core/configuration.WithHTTPClient
