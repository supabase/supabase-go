  client.session_management.custom_storage:
    status: implemented
    note: |
      The store is chosen per session, after sign-in, not per client,
      because a Go process may hold a session per user. It is keyless: a
      program that keeps many sessions in one backing store scopes each store
      value to its session.
    symbols:
      - auth.Client.SessionFromStore
      - auth.Session.Persist
      - auth.SessionFromStoreResult
      - auth.SessionFromStoreResult.Session
      - auth.SessionStore
      - auth.SessionStore.Delete
      - auth.SessionStore.Load
      - auth.SessionStore.Save
  client.session_management.persist_session:
    status: implemented
    note: |
      A session is in memory only until it persists to a store, so the
      capability's "memory only for the lifetime of the instance" is the
      default rather than a toggle.
