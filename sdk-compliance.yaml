# Compliance with the canonical Supabase SDK capability matrix.
# Spec: https://github.com/supabase/sdk
#
# Sparse by design, per the spec's own convention: unlisted ids default to not_implemented.
# Only list an id here once this SDK actually implements it.

sdk: go
api_coverage: full

# Construction, execution and shared value plumbing that spans features rather
# than implementing any single one: the client and configuration constructors
# with their sentinel errors and option type, the module identity constants
# they take, the root client's domain accessors, the builder spine every query
# rides, the shared HTTP error and response metadata shapes and the Range
# value family accepted across the range-aware filters. Types tied to exactly
# one feature are registered with that feature below instead.
supporting_symbols:
  - auth.Client
  - auth.ErrMissingJWT
  - auth.Error
  - auth.Error.Error
  - auth.Error.HTTPError
  - auth.New
  - auth.NewFromConfiguration
  - configuration.Configuration
  - configuration.Configuration.BaseURL
  - configuration.Configuration.HTTPClient
  - configuration.ErrInvalidURL
  - configuration.ErrMissingKey
  - configuration.ErrMissingURL
  - configuration.HTTPClient
  - configuration.HTTPClient.Do
  - configuration.New
  - configuration.Option
  - core.ModulePath
  - core.ModulePathAuth
  - core.ModulePathPostgrest
  - core.ModulePathRoot
  - postgrest.Client
  - postgrest.EmptyRange
  - postgrest.ErrMissingClient
  - postgrest.Error
  - postgrest.Error.Details
  - postgrest.Error.Error
  - postgrest.Error.HTTPError
  - postgrest.Error.Hint
  - postgrest.Error.Unwrap
  - postgrest.FilterBuilder
  - postgrest.New
  - postgrest.NewFromConfiguration
  - postgrest.NewRange
  - postgrest.Query
  - postgrest.QueryBuilder
  - postgrest.QueryBuilder.FilterBuilder
  - postgrest.Range
  - postgrest.RangeBuilder
  - postgrest.RangeBuilder.FromExclusive
  - postgrest.RangeBuilder.FromInclusive
  - postgrest.RangeBuilder.RangeFromBuilder
  - postgrest.RangeFromBuilder
  - postgrest.RangeFromBuilder.ToExclusive
  - postgrest.RangeFromBuilder.ToInclusive
  - postgrest.Response
  - postgrest.Response.Count
  - postgrest.Response.HTTPStatus
  - responses.HTTPError
  - responses.HTTPError.Code
  - responses.HTTPError.Error
  - responses.HTTPError.HTTPStatus
  - responses.HTTPError.Message
  - supabase.Client
  - supabase.Client.Auth
  - supabase.Client.Database
  - supabase.New

features:
  auth.session.get_claims:
    status: implemented
    note: |
      The token is an explicit required parameter. This server-side SDK holds
      no session store yet, so there is no "current session" to default from -
      the target use case is verifying tokens that arrive on inbound requests.
      Session-sourced defaults arrive with the session management capabilities.
    symbols:
      - auth.Client.GetClaims
    supporting_symbols:
      - auth.Claims
      - auth.Claims.Audience
      - auth.Claims.AuthenticatorAssuranceLevel
      - auth.Claims.CustomClaim
      - auth.Claims.Email
      - auth.Claims.ExpiresAt
      - auth.Claims.IsAnonymous
      - auth.Claims.IssuedAt
      - auth.Claims.Issuer
      - auth.Claims.Phone
      - auth.Claims.Role
      - auth.Claims.SessionID
      - auth.Claims.Subject
      - auth.ErrExpiredJWT
      - auth.ErrInvalidSignature
      - auth.ErrMalformedJWT
      - auth.JWTHeader
      - auth.JWTHeader.Algorithm
      - auth.JWTHeader.KeyID
      - auth.JWTHeader.Type
  auth.session.get_user:
    status: implemented
    note: |
      The token is an explicit required parameter, as for auth.session.get_claims.
    symbols:
      - auth.Client.GetUser
    supporting_symbols:
      - auth.Identity
      - auth.Identity.CreatedAt
      - auth.Identity.ID
      - auth.Identity.IdentityData
      - auth.Identity.IdentityID
      - auth.Identity.LastSignInAt
      - auth.Identity.Provider
      - auth.Identity.UpdatedAt
      - auth.Identity.UserID
      - auth.User
      - auth.User.AppMetadata
      - auth.User.Audience
      - auth.User.BannedUntil
      - auth.User.ConfirmedAt
      - auth.User.CreatedAt
      - auth.User.DeletedAt
      - auth.User.Email
      - auth.User.EmailConfirmedAt
      - auth.User.ID
      - auth.User.Identities
      - auth.User.IsAnonymous
      - auth.User.LastSignInAt
      - auth.User.Phone
      - auth.User.PhoneConfirmedAt
      - auth.User.Role
      - auth.User.UpdatedAt
      - auth.User.UserMetadata
  client.request_configuration.custom_http_client:
    status: implemented
    symbols:
      - configuration.WithHTTPClient
  client.request_configuration.global_headers:
    status: implemented
    symbols:
      - configuration.WithHeader
  database.configuration.access_token:
    status: implemented
    symbols:
      - postgrest.Client.WithAccessTokenProvider
      - postgrest.WithAccessTokenProvider
    supporting_symbols:
      - configuration.AccessTokenProvider
      - postgrest.ErrMissingAccessToken
  database.configuration.auto_retry:
    status: implemented
    symbols:
      - configuration.WithRetry
      - postgrest.WithRetry
    supporting_symbols:
      - configuration.Configuration.Retry
      - postgrest.Option
  database.configuration.request_timeout:
    status: implemented
    note: |
      Construction-time timeouts ride the standard library: pass WithHTTPClient
      an http.Client whose Timeout field is set. The wrapped transport
      preserves the field and the deadline cancels in-flight requests,
      response-body reads included.
    symbols:
      - configuration.WithHTTPClient
  database.mutate.delete:
    status: implemented
    symbols:
      - postgrest.FilterBuilder.Delete
    supporting_symbols:
      - postgrest.Execute
      - postgrest.Mutation
      - postgrest.MutationBuilder
  database.mutate.insert:
    status: implemented
    symbols:
      - postgrest.QueryBuilder.Insert
    supporting_symbols:
      - postgrest.Execute
      - postgrest.Mutation
      - postgrest.MutationBuilder
  database.mutate.select_after_mutation:
    status: implemented
    note: |
      Executing a mutation through Collect returns its affected rows.
      MutationBuilder.Returning narrows them for insert, update and delete,
      and UpsertBuilder.Returning for upsert.
    symbols:
      - postgrest.MutationBuilder.Returning
      - postgrest.UpsertBuilder.Returning
    supporting_symbols:
      - postgrest.Collect
  database.mutate.update:
    status: implemented
    symbols:
      - postgrest.FilterBuilder.Update
    supporting_symbols:
      - postgrest.Execute
      - postgrest.Mutation
      - postgrest.MutationBuilder
  database.mutate.upsert:
    status: implemented
    symbols:
      - postgrest.QueryBuilder.Upsert
    supporting_symbols:
      - postgrest.Execute
      - postgrest.Mutation
      - postgrest.UpsertBuilder
      - postgrest.UpsertBuilder.OnConflict
      - postgrest.UpsertBuilder.IgnoreDuplicates
  database.query.from_table:
    status: implemented
    symbols:
      - postgrest.From
    supporting_symbols:
      - postgrest.ErrMissingTable
  database.query.rpc:
    status: implemented
    note: |
      POST and GET invocation, mode-declared by the caller per function
      through RPC (the Rows and Value shapes) and RPCVoid. Counts with HEAD,
      result shaping, resource embedding, raw-body parameters and custom media
      are deferred.
    symbols:
      - postgrest.RPC
      - postgrest.RPCVoid
    supporting_symbols:
