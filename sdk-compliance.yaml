# Compliance with the canonical Supabase SDK capability matrix.
# Spec: https://github.com/supabase/sdk
#
# Sparse by design, per the spec's own convention: unlisted ids default to not_implemented.
# Only list an id here once this SDK actually implements it.

sdk: go
api_coverage: full

# Construction, execution and shared value plumbing that spans features rather
# than implementing any single one: the client and configuration constructors
# with their sentinel errors and option type, the module identity constants
# they take, the root client's domain accessors, the builder spine every query
# rides, the shared HTTP error and response metadata shapes and the Range
# value family accepted across the range-aware filters. Types tied to exactly
# one feature are registered with that feature below instead.
