# Compliance with the canonical Supabase SDK capability matrix.
# Spec: https://github.com/supabase/sdk
#
# Sparse by design, per the spec's own convention: unlisted ids default to not_implemented.
# Only list an id here once this SDK actually implements it.

sdk: go

features:
  client.request_configuration.custom_http_client:
    status: implemented
    symbols:
      - configuration.WithHTTPClient
  client.request_configuration.global_headers:
    status: implemented
    symbols:
      - configuration.WithHeader
  database.configuration.access_token:
    status: implemented
    symbols:
      - postgrest.Client.WithAccessTokenProvider
      - postgrest.WithAccessTokenProvider
    supporting_symbols:
      - configuration.AccessTokenProvider
      - postgrest.ErrMissingAccessToken
  database.configuration.auto_retry:
    status: implemented
    symbols:
      - configuration.WithRetry
      - postgrest.WithRetry
    supporting_symbols:
      - configuration.Configuration.Retry
      - postgrest.Option
  database.configuration.request_timeout:
    status: implemented
    note: |
      Construction-time timeouts ride the standard library: pass WithHTTPClient
      an http.Client whose Timeout field is set. The wrapped transport
      preserves the field and the deadline cancels in-flight requests,
      response-body reads included.
    symbols:
      - configuration.WithHTTPClient
  database.mutate.delete:
    status: implemented
    symbols:
      - postgrest.FilterBuilder.Delete
    supporting_symbols:
      - postgrest.Execute
      - postgrest.Mutation
      - postgrest.MutationBuilder
  database.mutate.insert:
    status: implemented
    symbols:
      - postgrest.QueryBuilder.Insert
    supporting_symbols:
      - postgrest.Execute
      - postgrest.Mutation
      - postgrest.MutationBuilder
  database.mutate.select_after_mutation:
    status: implemented
    note: |
      Executing a mutation through Collect returns its affected rows.
      MutationBuilder.Returning narrows them for insert, update and delete,
      and UpsertBuilder.Returning for upsert.
    symbols:
      - postgrest.MutationBuilder.Returning
      - postgrest.UpsertBuilder.Returning
    supporting_symbols:
      - postgrest.Collect
  database.mutate.update:
    status: implemented
    symbols:
      - postgrest.FilterBuilder.Update
    supporting_symbols:
      - postgrest.Execute
      - postgrest.Mutation
      - postgrest.MutationBuilder
  database.mutate.upsert:
    status: implemented
    symbols:
      - postgrest.QueryBuilder.Upsert
    supporting_symbols:
      - postgrest.Execute
      - postgrest.Mutation
      - postgrest.UpsertBuilder
      - postgrest.UpsertBuilder.OnConflict
      - postgrest.UpsertBuilder.IgnoreDuplicates
  database.query.from_table:
    status: implemented
    symbols:
      - postgrest.From
  database.query.rpc:
    status: implemented
    note: |
      POST and GET invocation, mode-declared by the caller per function
      through RPC (the Rows and Value shapes) and RPCVoid. Counts with HEAD,
      result shaping, resource embedding, raw-body parameters and custom media
      are deferred.
    symbols:
      - postgrest.RPC
      - postgrest.RPCVoid
    supporting_symbols:
      - postgrest.CollectRaw
      - postgrest.ErrMissingFunction
      - postgrest.RPCBuilder
      - postgrest.RPCBuilder.Arguments
      - postgrest.RPCBuilder.Rows
      - postgrest.RPCBuilder.Value
      - postgrest.RPCReadOnlyRowsCall
      - postgrest.RPCReadOnlyValueCall
      - postgrest.RPCRowsCall
      - postgrest.RPCRowsCall.ReadOnly
      - postgrest.RPCValueCall
      - postgrest.RPCValueCall.ReadOnly
      - postgrest.RPCVoidCall
      - postgrest.RPCVoidCall.Arguments
      - postgrest.RawQuery
  database.query.select:
    status: implemented
    symbols:
      - postgrest.QueryBuilder.Select
  database.using_filters.contained_by:
    status: implemented
    symbols:
      - postgrest.FilterBuilder.ContainedBy
      - postgrest.FilterBuilder.ContainedIn
      - postgrest.FilterBuilder.ContainedByJSON
  database.using_filters.contains:
