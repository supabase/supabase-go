# Compliance with the canonical Supabase SDK capability matrix.
# Spec: https://github.com/supabase/sdk
#
# Sparse by design, per the spec's own convention: unlisted ids default to not_implemented.
# Only list an id here once this SDK actually implements it.

sdk: go

features:
  client.request_configuration.custom_http_client:
    status: implemented
    symbols:
      - configuration.WithHTTPClient
  client.request_configuration.global_headers:
    status: implemented
    symbols:
      - configuration.WithHeader
  database.query.from_table:
    status: implemented
    symbols:
      - postgrest.From
  database.query.select:
    status: implemented
    symbols:
      - postgrest.QueryBuilder.Select
  database.using_modifiers.limit:
    status: implemented
    symbols:
      - postgrest.FilterBuilder.Limit
  database.using_modifiers.order:
    status: implemented
    symbols:
      - postgrest.FilterBuilder.Order
      - postgrest.OrderedBuilder.Descending
      - postgrest.OrderedBuilder.NullsFirst
      - postgrest.OrderedDescendingBuilder.NullsLast
  database.using_modifiers.request_cancellation:
    status: implemented
    symbols:
      - postgrest.Collect
